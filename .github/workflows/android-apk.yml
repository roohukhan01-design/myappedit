name: Build Roohu ClipForge APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Android project from uploaded root files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/roohu/clipforge
          mkdir -p app/src/main/res/{layout,values,drawable,mipmap-anydpi}
          mkdir -p app/src/main/assets
          mkdir -p shared/core shared/test

          cp build-1.gradle app/build.gradle
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp activity_main.xml app/src/main/res/layout/activity_main.xml
          cp colors.xml strings.xml themes.xml app/src/main/res/values/
          cp splash_bg.xml splash_glow.xml splash_logo.xml app/src/main/res/drawable/
          cp ic_launcher_foreground.xml app/src/main/res/drawable/ic_launcher_foreground.xml
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher.xml
          cp ic_launcher_round.xml app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          cp Roohu-ClipForge.html app/src/main/assets/Roohu-ClipForge.html
          cp ./*.java app/src/main/java/com/roohu/clipforge/
          cp validate.js shared/core/validate.js
          cp validate.js app/src/main/assets/validate.js
          cp validate.test.js projects.test.js subtitles.test.js shared/test/
          test -s app/src/main/assets/Roohu-ClipForge.html
          test -s app/src/main/java/com/roohu/clipforge/MainActivity.java
          echo "Android project staging completed."

      - name: Download offline speech models
        shell: bash
        run: |
          set -euo pipefail
          cd app/src/main/assets
          curl -fL --retry 3 --retry-delay 2 -o en.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q en.zip
          mv vosk-model-small-en-us-0.15 model-en
          rm en.zip
          curl -fL --retry 3 --retry-delay 2 -o hi.zip https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip
          unzip -q hi.zip
          mv vosk-model-small-hi-0.22 model-hi
          rm hi.zip
          test -d model-en && test -d model-hi

      - name: Download display fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/fonts
          cd app/src/main/assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          get() { curl -fsSL --retry 2 -o "$2" "$B/$1/$2" || echo "Optional font unavailable: $2"; }
          get anton Anton-Regular.ttf
          get bebasneue BebasNeue-Regular.ttf
          get bangers Bangers-Regular.ttf
          get archivoblack ArchivoBlack-Regular.ttf
          get poppins Poppins-Black.ttf
          get bungee Bungee-Regular.ttf
          get luckiestguy LuckiestGuy-Regular.ttf
          get russoone RussoOne-Regular.ttf
          get blackopsone BlackOpsOne-Regular.ttf
          get tajawal Tajawal-Black.ttf

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run JavaScript validation tests
        run: |
          node shared/test/validate.test.js
          node shared/test/projects.test.js
          node shared/test/subtitles.test.js

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Roohu-ClipForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
